<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Legacy monorepo</title>
	<style>
		:root { color-scheme: light dark; }
		body {
			margin: 0;
			padding: 48px 16px;
			font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			background: #fafafa;
			color: #1a1a1a;
		}
		main { max-width: 1200px; margin: 0 auto; }
		h1 { margin: 0 0 8px; font-size: 28px; }
		p { margin: 0 0 24px; color: #666; }
		ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 16px; }
		@media (min-width: 768px) { ul { grid-template-columns: 1fr 1fr; } }
		a {
			display: block;
			overflow: hidden;
			border: 1px solid #ddd;
			border-radius: 8px;
			background: #fff;
			color: inherit;
			text-decoration: none;
			transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease;
		}
		img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; background: #eee; transition: transform .4s ease; }
		strong { display: block; padding: 12px 16px 4px; }
		span { display: block; padding: 0 16px 12px; color: #666; }
		span:empty { display: none; }
		a:hover, a:focus-visible { border-color: #1a1a1a; box-shadow: 0 6px 20px rgba(0, 0, 0, .12); transform: translateY(-2px); }
		a:hover img, a:focus-visible img { transform: scale(1.05); }
		@media (max-width: 767px) {
			body { padding: 24px 12px; }
			ul { gap: 12px; }
			img { aspect-ratio: 2 / 1; }
			strong { padding: 8px 12px 2px; }
			span { padding: 0 12px 8px; }
		}
		@media (prefers-reduced-motion: reduce) {
			a, img { transition: none; }
			a:hover, a:focus-visible, a:hover img, a:focus-visible img { transform: none; }
		}
		@media (prefers-color-scheme: dark) {
			body { background: #161616; color: #eee; }
			p, span { color: #999; }
			a { background: #202020; border-color: #333; }
			img { background: #2a2a2a; }
			a:hover, a:focus-visible { border-color: #eee; }
		}
	</style>
</head>
<body>
	<main>
		<h1>Legacy monorepo</h1>
		<p>Старые проекты по вёрстке и CMS-интеграциям (WordPress и Bitrix).</p>
		<ul>
<!-- PROJECTS -->
		</ul>
	</main>
</body>
</html>
